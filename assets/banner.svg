<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-labelledby="title desc">
<title id="title">Needle — OSINT training platform</title>
<desc id="desc">Баннер русскоязычного интерактивного OSINT-тренажёра Needle. Find the needle.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#080d18"/><stop offset="1" stop-color="#17213a"/></linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#54e4d4"/><stop offset="1" stop-color="#8b7cff"/></linearGradient>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#28344f" stroke-width="1"/></pattern>
  <filter id="glow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="7" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="1200" height="360" rx="22" fill="url(#bg)"/>
<rect width="1200" height="360" rx="22" fill="url(#grid)" opacity=".55"/>
<text x="72" y="70" font-family="monospace" font-size="18" letter-spacing="4" fill="#54e4d4">&gt; OPEN SOURCE INTELLIGENCE / RU</text>
<text x="65" y="205" font-family="monospace" font-size="142" font-weight="800" letter-spacing="5" fill="#f3f6ff">NEEDLE</text>
<text x="74" y="260" font-family="monospace" font-size="28" fill="#a9b8d0">Find the needle.</text>
<text x="74" y="306" font-family="Arial,sans-serif" font-size="18" fill="#7486a6">Интерактивный OSINT-тренажёр</text>
<g transform="translate(920 70)" filter="url(#glow)" stroke="url(#accent)" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <circle cx="92" cy="92" r="66" stroke-width="10"/>
  <path d="M140 140L220 220" stroke-width="17"/>
  <path d="M92 48L92 136M48 92H136" stroke-width="2" opacity=".55"/>
  <path d="M65 92L85 112L121 72" stroke-width="7"/>
</g>
<g fill="#54e4d4" opacity=".75">
  <circle cx="780" cy="290" r="3"/><circle cx="820" cy="270" r="2"/><circle cx="850" cy="305" r="3"/>
  <circle cx="900" cy="280" r="2"/><circle cx="1120" cy="300" r="3"/>
</g>
</svg>